name: Build Kroty Net Real APK & Project ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Clean & Run Python Builders (Parts 1, 2, 3)
        run: |
          python3 -c '
          for fname in ["setup_part1.py", "setup_part2.py", "setup_part3.py"]:
              with open(fname, "r", encoding="utf-8") as f:
                  text = f.read()
              marker = "generated successfully!\")"
              if marker in text:
                  text = text[:text.index(marker) + len(marker)] + "\n"
              with open(fname, "w", encoding="utf-8") as f:
                  f.write(text)
          '
          python3 setup_part1.py
          python3 setup_part2.py
          python3 setup_part3.py

      - name: Package Full Source Project as ZIP
        run: |
          zip -r KrotyNet-Full-Source-Project.zip app gradle build.gradle.kts settings.gradle.kts gradle.properties

      - name: Upload Full Source Project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KrotyNet-Full-Source-Project-ZIP
          path: KrotyNet-Full-Source-Project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KrotyNet-Real-APK
          path: app/build/outputs/apk/debug/app-debug.apk
