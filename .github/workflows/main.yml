name: Build Kroty Net Real APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Kroty Pro v3.2 Surgical Upgrades
        run: |
          FIRST_COMMIT=$(git log --reverse --pretty=format:%H -- setup_part3.py | head -n 1)
          if [ -n "$FIRST_COMMIT" ]; then
            git show "$FIRST_COMMIT:setup_part1.py" > /tmp/orig_part1.py 2>/dev/null || true
            git show "$FIRST_COMMIT:setup_part2.py" > /tmp/orig_part2.py 2>/dev/null || true
            git show "$FIRST_COMMIT:setup_part3.py" > /tmp/orig_part3.py 2>/dev/null || true
          fi

          python3 - << 'EOF'
          import re, os

          for script_name in ['/tmp/orig_part1.py', '/tmp/orig_part2.py', '/tmp/orig_part3.py']:
              if not os.path.exists(script_name):
                  continue
              with open(script_name, 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = re.compile(r'write_file\(\s*"([^"]+)"\s*,\s*r?"""(.*?)"""\s*\)', re.DOTALL)
              for file_path, file_content in pattern.findall(content):
                  file_path = file_path.strip()
                  dir_name = os.path.dirname(file_path)
                  if dir_name:
                      os.makedirs(dir_name, exist_ok=True)
                  with open(file_path, 'w', encoding='utf-8') as out:
                      out.write(file_content.strip() + '\n')

          # 1. Update Top Bar Title in MainActivity.kt to confirm v3.2 installation
          main_act_path = "app/src/main/java/com/example/MainActivity.kt"
          if os.path.exists(main_act_path):
              with open(main_act_path, "r", encoding="utf-8") as f:
                  m_code = f.read()
              m_code = m_code.replace('"كروتي نت (Kroty Net)"', '"كروتي نت • Kroty Pro v3.2"')
              with open(main_act_path, "w", encoding="utf-8") as f:
                  f.write(m_code)

          # 2. Write Upgraded ScannerScreen.kt (Tab-scoped camera release + Flash/Gallery bar + LazyRow chips)
          scanner_code = r'''package com.example.ui.screens

          import android.Manifest
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.util.Size
          import android.view.View
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageAnalysis
          import androidx.camera.core.Preview
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.CornerRadius
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleEventObserver
          import androidx.lifecycle.LifecycleOwner
          import androidx.lifecycle.LifecycleRegistry
          import androidx.lifecycle.compose.LocalLifecycleOwner
          import com.example.domain.scanner.KrotyCameraAnalyzer
          import com.example.ui.KrotyViewModel
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import java.util.concurrent.Executors

          private val KrotyDarkBg = Color(0xFF0A0E17)
          private val KrotyCardBg = Color(0xFF131B2E)
          private val KrotyCardBorder = Color(0xFF1E293B)
          private val KrotyCyan = Color(0xFF00E5FF)
          private val KrotyEmerald = Color(0xFF00E676)
          private val KrotyAmber = Color(0xFFFFB300)
          private val KrotyCoralRed = Color(0xFFFF5252)
          private val KrotyTextPrimary = Color(0xFFF8FAFC)
          private val KrotyTextSecondary = Color(0xFF94A3B8)

          private class ScannerTabLifecycleOwner : LifecycleOwner {
              private val registry = LifecycleRegistry(this)
              override val lifecycle: Lifecycle get() = registry
              fun handleEvent(event: Lifecycle.Event) {
                  try { registry.handleLifecycleEvent(event) } catch (_: Exception) {}
              }
              fun forceDestroy() {
                  try {
                      if (registry.currentState != Lifecycle.State.DESTROYED) {
                          registry.currentState = Lifecycle.State.DESTROYED
                      }
                  } catch (_: Exception) {}
              }
          }

          @Composable
          fun ScannerScreen(
              viewModel: KrotyViewModel,
              onConnectedNavigateToRadar: () -> Unit = {},
              onNavigateToRadar: () -> Unit = onConnectedNavigateToRadar
          ) {
              val context = LocalContext.current
              val parentLifecycleOwner = LocalLifecycleOwner.current
              val appContainer = viewModel.appContainer

              var hasCameraPermission by remember {
                  mutableStateOf(
                      ContextCompat.checkSelfPermission(context, Manifest.permission.CAMERA) ==
                          PackageManager.PERMISSION_GRANTED
                  )
              }

              val permissionLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.RequestPermission()
              ) { granted -> hasCameraPermission = granted }

              LaunchedEffect(Unit) {
                  if (!hasCameraPermission) {
                      permissionLauncher.launch(Manifest.permission.CAMERA)
                  }
              }

              var detectedCode by remember { mutableStateOf("") }
              var isConfirmedConsensus by remember { mutableStateOf(false) }
              var expectedLengthFilter by remember { mutableStateOf<Int?>(null) }
              var isTorchEnabled by remember { mutableStateOf(false) }
              var zoomRatio by remember { mutableFloatStateOf(1f) }
              var cameraInstance by remember { mutableStateOf<Camera?>(null) }
              var cameraProviderInstance by remember { mutableStateOf<ProcessCameraProvider?>(null) }
              var isGalleryScanning by remember { mutableStateOf(false) }
              var manualEditCode by remember { mutableStateOf("") }
              var autoConnectTriggered by remember { mutableStateOf(false) }

              val tabLifecycleOwner = remember { ScannerTabLifecycleOwner() }
              val cameraExecutor = remember { Executors.newSingleThreadExecutor() }

              fun forceShutDownCameraHardware() {
                  try { cameraInstance?.cameraControl?.enableTorch(false) } catch (_: Exception) {}
                  try { cameraProviderInstance?.unbindAll() } catch (_: Exception) {}
                  cameraInstance = null
                  tabLifecycleOwner.forceDestroy()
              }

              DisposableEffect(parentLifecycleOwner) {
                  tabLifecycleOwner.handleEvent(Lifecycle.Event.ON_CREATE)
                  tabLifecycleOwner.handleEvent(Lifecycle.Event.ON_START)
                  tabLifecycleOwner.handleEvent(Lifecycle.Event.ON_RESUME)

                  val parentObserver = LifecycleEventObserver { _, event ->
                      when (event) {
                          Lifecycle.Event.ON_RESUME -> tabLifecycleOwner.handleEvent(Lifecycle.Event.ON_RESUME)
                          Lifecycle.Event.ON_PAUSE -> {
                              try { cameraInstance?.cameraControl?.enableTorch(false) } catch (_: Exception) {}
                              isTorchEnabled = false
                              tabLifecycleOwner.handleEvent(Lifecycle.Event.ON_PAUSE)
                          }
                          Lifecycle.Event.ON_STOP -> {
                              try { cameraProviderInstance?.unbindAll() } catch (_: Exception) {}
                              tabLifecycleOwner.handleEvent(Lifecycle.Event.ON_STOP)
                          }
                          Lifecycle.Event.ON_DESTROY -> forceShutDownCameraHardware()
                          else -> {}
                      }
                  }
                  parentLifecycleOwner.lifecycle.addObserver(parentObserver)

                  onDispose {
                      parentLifecycleOwner.lifecycle.removeObserver(parentObserver)
                      forceShutDownCameraHardware()
                      try { cameraExecutor.shutdownNow() } catch (_: Exception) {}
                  }
              }

              val galleryLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.GetContent()
              ) { uri: Uri? ->
                  if (uri != null) {
                      isGalleryScanning = true
                      try {
                          val inputImage = InputImage.fromFilePath(context, uri)
                          val recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                          recognizer.process(inputImage)
                              .addOnSuccessListener { visionText ->
                                  isGalleryScanning = false
                                  val candidate = appContainer.ocrParser.extractBestCandidate(
                                      visionText = visionText,
                                      expectedLength = expectedLengthFilter
                                  )
                                  if (candidate != null) {
                                      detectedCode = candidate.code
                                      manualEditCode = candidate.code
                                      isConfirmedConsensus = true
                                  } else {
                                      val fallback = visionText.text
                                          .replace('O', '0').replace('o', '0')
                                          .replace('I', '1').replace('l', '1')
                                          .replace('S', '5').replace('B', '8')
                                          .lines()
                                          .map { it.trim() }
                                          .firstOrNull { it.length in 4..16 && it.any { c -> c.isDigit() } }
                                      if (fallback != null) {
                                          detectedCode = fallback
                                          manualEditCode = fallback
                                          isConfirmedConsensus = true
                                      }
                                  }
                              }
                              .addOnFailureListener { isGalleryScanning = false }
                      } catch (_: Exception) {
                          isGalleryScanning = false
                      }
                  }
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(KrotyDarkBg)
                      .padding(12.dp),
                  verticalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = KrotyCardBg),
                      border = BorderStroke(1.dp, KrotyCardBorder),
                      shape = RoundedCornerShape(16.dp)
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(12.dp),
                          verticalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Icon(Icons.Default.QrCodeScanner, contentDescription = null, tint = KrotyCyan)
                              Spacer(modifier = Modifier.width(8.dp))
                              Text(
                                  text = "ماسح الكروت الذكي (CameraX + ML Kit)",
                                  style = MaterialTheme.typography.titleMedium,
                                  fontWeight = FontWeight.Bold,
                                  color = KrotyTextPrimary,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis,
                                  modifier = Modifier.weight(1f)
                              )
                          }

                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              Button(
                                  onClick = {
                                      val nextTorch = !isTorchEnabled
                                      isTorchEnabled = nextTorch
                                      cameraInstance?.cameraControl?.enableTorch(nextTorch)
                                  },
                                  modifier = Modifier.weight(1f),
                                  colors = ButtonDefaults.buttonColors(
                                      containerColor = if (isTorchEnabled) KrotyAmber else KrotyCardBorder,
                                      contentColor = if (isTorchEnabled) Color.Black else KrotyTextPrimary
                                  ),
                                  shape = RoundedCornerShape(10.dp),
                                  contentPadding = PaddingValues(vertical = 8.dp, horizontal = 10.dp)
                              ) {
                                  Icon(
                                      imageVector = if (isTorchEnabled) Icons.Default.FlashOn else Icons.Default.FlashOff,
                                      contentDescription = null,
                                      modifier = Modifier.size(18.dp)
                                  )
                                  Spacer(modifier = Modifier.width(6.dp))
                                  Text(
                                      text = if (isTorchEnabled) "إيقاف الفلاش" else "تشغيل الفلاش",
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 13.sp,
                                      maxLines = 1,
                                      softWrap = false
                                  )
                              }

                              OutlinedButton(
                                  onClick = { galleryLauncher.launch("image/*") },
                                  modifier = Modifier.weight(1f),
                                  border = BorderStroke(1.dp, KrotyCyan),
                                  shape = RoundedCornerShape(10.dp),
                                  contentPadding = PaddingValues(vertical = 8.dp, horizontal = 10.dp)
                              ) {
                                  Icon(
                                      imageVector = Icons.Default.PhotoLibrary,
                                      contentDescription = null,
                                      tint = KrotyCyan,
                                      modifier = Modifier.size(18.dp)
                                  )
                                  Spacer(modifier = Modifier.width(6.dp))
                                  Text(
                                      text = "صورة من المعرض",
                                      color = KrotyCyan,
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 13.sp,
                                      maxLines = 1,
                                      softWrap = false
                                  )
                              }
                          }
                      }
                  }

                  val lengthOptions = listOf(null to "تلقائي شامل", 6 to "6 أرقام", 8 to "8 أرقام", 10 to "10 أرقام", 12 to "12 رقم")
                  LazyRow(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                      contentPadding = PaddingValues(horizontal = 2.dp)
                  ) {
                      items(lengthOptions) { (len, label) ->
                          FilterChip(
                              selected = expectedLengthFilter == len,
                              onClick = {
                                  expectedLengthFilter = len
                                  appContainer.consensusTracker.reset()
                              },
                              label = {
                                  Text(
                                      text = label,
                                      fontSize = 12.sp,
                                      maxLines = 1,
                                      softWrap = false
                                  )
                              },
                              colors = FilterChipDefaults.filterChipColors(
                                  selectedContainerColor = KrotyCyan.copy(alpha = 0.22f),
                                  selectedLabelColor = KrotyCyan
                              )
                          )
                      }
                  }

                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f)
                          .clip(RoundedCornerShape(18.dp))
                          .background(Color.Black),
                      contentAlignment = Alignment.Center
                  ) {
                      if (hasCameraPermission) {
                          AndroidView(
                              modifier = Modifier.fillMaxSize(),
                              factory = { ctx ->
                                  val previewView = PreviewView(ctx).apply {
                                      implementationMode = PreviewView.ImplementationMode.COMPATIBLE
                                      scaleType = PreviewView.ScaleType.FILL_CENTER
                                  }

                                  previewView.addOnAttachStateChangeListener(object : View.OnAttachStateChangeListener {
                                      override fun onViewAttachedToWindow(v: View) {}
                                      override fun onViewDetachedFromWindow(v: View) {
                                          forceShutDownCameraHardware()
                                      }
                                  })

                                  val cameraProviderFuture = ProcessCameraProvider.getInstance(ctx)
                                  cameraProviderFuture.addListener({
                                      try {
                                          val cameraProvider = cameraProviderFuture.get()
                                          cameraProviderInstance = cameraProvider

                                          if (tabLifecycleOwner.lifecycle.currentState == Lifecycle.State.DESTROYED) {
                                              cameraProvider.unbindAll()
                                              return@addListener
                                          }

                                          val preview = Preview.Builder().build().also {
                                              it.setSurfaceProvider(previewView.surfaceProvider)
                                          }

                                          val analyzer = KrotyCameraAnalyzer(
                                              ocrParser = appContainer.ocrParser,
                                              consensusTracker = appContainer.consensusTracker,
                                              expectedLengthProvider = { expectedLengthFilter },
                                              onLiveCandidateDetected = { liveCode ->
                                                  if (!isConfirmedConsensus) {
                                                      detectedCode = liveCode
                                                  }
                                              },
                                              onConsensusConfirmed = { confirmedCode, _ ->
                                                  detectedCode = confirmedCode
                                                  manualEditCode = confirmedCode
                                                  isConfirmedConsensus = true
                                              }
                                          )

                                          val imageAnalysis = ImageAnalysis.Builder()
                                              .setTargetResolution(Size(1280, 720))
                                              .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                                              .build()
                                              .also { it.setAnalyzer(cameraExecutor, analyzer) }

                                          cameraProvider.unbindAll()
                                          cameraInstance = cameraProvider.bindToLifecycle(
                                              tabLifecycleOwner,
                                              CameraSelector.DEFAULT_BACK_CAMERA,
                                              preview,
                                              imageAnalysis
                                          )
                                      } catch (_: Exception) {}
                                  }, ContextCompat.getMainExecutor(ctx))

                                  previewView
                              }
                          )

                          Canvas(modifier = Modifier.fillMaxSize()) {
                              val boxW = size.width * 0.82f
                              val boxH = size.height * 0.36f
                              val left = (size.width - boxW) / 2f
                              val top = (size.height - boxH) / 2f
                              val strokeColor = if (isConfirmedConsensus) KrotyEmerald else KrotyCyan

                              drawRoundRect(
                                  color = strokeColor,
                                  topLeft = Offset(left, top),
                                  size = androidx.compose.ui.geometry.Size(boxW, boxH),
                                  cornerRadius = CornerRadius(24f, 24f),
                                  style = Stroke(width = 5f)
                              )
                          }

                          Column(
                              modifier = Modifier
                                  .align(Alignment.BottomCenter)
                                  .fillMaxWidth()
                                  .background(Color.Black.copy(alpha = 0.6f))
                                  .padding(horizontal = 16.dp, vertical = 6.dp)
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween
                              ) {
                                  Text("مستوى التقريب (Zoom)", color = KrotyTextSecondary, fontSize = 11.sp, maxLines = 1)
                                  Text("${String.format("%.1f", zoomRatio)}x", color = KrotyCyan, fontSize = 11.sp, fontWeight = FontWeight.Bold, maxLines = 1)
                              }
                              Slider(
                                  value = zoomRatio,
                                  onValueChange = { newZoom ->
                                      zoomRatio = newZoom
                                      cameraInstance?.cameraControl?.setZoomRatio(newZoom)
                                  },
                                  valueRange = 1f..3f,
                                  colors = SliderDefaults.colors(thumbColor = KrotyCyan, activeTrackColor = KrotyCyan)
                              )
                          }
                      } else {
                          Column(
                              horizontalAlignment = Alignment.CenterHorizontally,
                              modifier = Modifier.padding(24.dp)
                          ) {
                              Icon(Icons.Default.CameraAlt, contentDescription = null, tint = KrotyCoralRed, modifier = Modifier.size(48.dp))
                              Spacer(modifier = Modifier.height(8.dp))
                              Text("يلزم منح صلاحية الكاميرا لمسح الكروت الحقيقية", color = KrotyTextPrimary)
                              Spacer(modifier = Modifier.height(8.dp))
                              Button(onClick = { permissionLauncher.launch(Manifest.permission.CAMERA) }) {
                                  Text("منح صلاحية الكاميرا الآن", maxLines = 1, softWrap = false)
                              }
                          }
                      }
                  }

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = KrotyCardBg),
                      border = BorderStroke(1.dp, if (isConfirmedConsensus) KrotyEmerald else KrotyCardBorder),
                      shape = RoundedCornerShape(16.dp)
                  ) {
                      Column(modifier = Modifier.padding(12.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  text = if (isConfirmedConsensus) "تم تأكيد الكرت بنجاح (تطابق إطارين)"
                                  else if (isGalleryScanning) "جاري فحص الصورة..."
                                  else "وجّه الكاميرا نحو رقم الكرت أو الباركود",
                                  color = if (isConfirmedConsensus) KrotyEmerald else KrotyTextSecondary,
                                  fontSize = 12.sp,
                                  fontWeight = FontWeight.SemiBold,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis,
                                  modifier = Modifier.weight(1f)
                              )
                              if (detectedCode.isNotEmpty()) {
                                  TextButton(onClick = {
                                      detectedCode = ""
                                      manualEditCode = ""
                                      isConfirmedConsensus = false
                                      autoConnectTriggered = false
                                      appContainer.consensusTracker.reset()
                                  }) {
                                      Text("إعادة مسح", color = KrotyAmber, fontSize = 12.sp, maxLines = 1, softWrap = false)
                                  }
                              }
                          }

                          OutlinedTextField(
                              value = manualEditCode.ifEmpty { detectedCode },
                              onValueChange = {
                                  manualEditCode = it.trim()
                                  detectedCode = it.trim()
                              },
                              label = { Text("الكود المستخرج (قابل للتعديل أو اللصق)") },
                              singleLine = true,
                              textStyle = LocalTextStyle.current.copy(
                                  fontFamily = FontFamily.Monospace,
                                  fontWeight = FontWeight.Bold,
                                  fontSize = 18.sp,
                                  color = KrotyCyan
                              ),
                              modifier = Modifier.fillMaxWidth()
                          )

                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              Button(
                                  onClick = {
                                      val finalCode = manualEditCode.ifEmpty { detectedCode }
                                      if (finalCode.isNotBlank()) {
                                          forceShutDownCameraHardware()
                                          viewModel.saveScannedVoucherAndConnect(
                                              code = finalCode,
                                              categoryLabel = "مسح كاميرا ذكي",
                                              priceYemeniRial = 100,
                                              connectImmediately = true
                                          )
                                          autoConnectTriggered = true
                                          onNavigateToRadar()
                                      }
                                  },
                                  enabled = (manualEditCode.isNotBlank() || detectedCode.isNotBlank()),
                                  modifier = Modifier.weight(1f),
                                  colors = ButtonDefaults.buttonColors(containerColor = KrotyEmerald, contentColor = Color.Black)
                              ) {
                                  Icon(Icons.Default.Bolt, contentDescription = null)
                                  Spacer(modifier = Modifier.width(4.dp))
                                  Text("حفظ واتصال فوري", fontWeight = FontWeight.Bold, maxLines = 1, softWrap = false)
                              }

                              OutlinedButton(
                                  onClick = {
                                      val finalCode = manualEditCode.ifEmpty { detectedCode }
                                      if (finalCode.isNotBlank()) {
                                          viewModel.saveScannedVoucherAndConnect(
                                              code = finalCode,
                                              categoryLabel = "مخزون المحفظة",
                                              priceYemeniRial = 100,
                                              connectImmediately = false
                                          )
                                          detectedCode = ""
                                          manualEditCode = ""
                                          isConfirmedConsensus = false
                                          appContainer.consensusTracker.reset()
                                      }
                                  },
                                  enabled = (manualEditCode.isNotBlank() || detectedCode.isNotBlank()),
                                  modifier = Modifier.weight(1f),
                                  border = BorderStroke(1.dp, KrotyCyan)
                              ) {
                                  Icon(Icons.Default.Save, contentDescription = null, tint = KrotyCyan)
                                  Spacer(modifier = Modifier.width(4.dp))
                                  Text("حفظ بالمحفظة", color = KrotyCyan, maxLines = 1, softWrap = false)
                              }
                          }
                      }
                  }
              }
          }
          '''
          with open("app/src/main/java/com/example/ui/screens/ScannerScreen.kt", "w", encoding="utf-8") as f:
              f.write(scanner_code.strip() + "\n")

          # 3. Surgical Upgrade of RadarScreen.kt (Keep working ViewModel bindings + Inject Kroty Pro Portal Cockpit + Fix vertical text wrap)
          radar_path = "app/src/main/java/com/example/ui/screens/RadarScreen.kt"
          if os.path.exists(radar_path):
              with open(radar_path, "r", encoding="utf-8") as f:
                  r_code = f.read()

              extra_imports = """package com.example.ui.screens

          import android.view.View
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.style.TextOverflow
          """
              r_code = r_code.replace("package com.example.ui.screens", extra_imports, 1)

              # Prevent any button/chip text from wrapping vertically letter-by-letter
              r_code = r_code.replace('"يتعلم..."', '"🎯 يتعلم"')
              r_code = re.sub(
                  r'Text\(\s*(if\s*\([^)\n]+\)\s*"[^"\n]+"\s*else\s*"[^"\n]+")\s*\)',
                  r'Text(\1, maxLines = 1, softWrap = false)',
                  r_code
              )
              r_code = re.sub(
                  r'Text\(\s*("[^"\n]{1,25}")\s*\)',
                  r'Text(\1, maxLines = 1, softWrap = false)',
                  r_code
              )

              # Replace AndroidView( in RadarScreen.kt with KrotyCockpitAndroidView(
              r_code = r_code.replace("AndroidView(", "KrotyCockpitAndroidView(")

              cockpit_appendix = r'''
          @Composable
          fun <T : View> KrotyCockpitAndroidView(
              factory: (android.content.Context) -> T,
              modifier: Modifier = Modifier,
              update: (T) -> Unit = {}
          ) {
              var capturedWebView by remember { mutableStateOf<android.webkit.WebView?>(null) }
              var currentUrlDisplay by remember { mutableStateOf("http://10.0.0.1/login") }
              var isDesktopMode by remember { mutableStateOf(false) }

              Column(modifier = modifier.fillMaxSize().background(Color(0xFF0A0E17))) {
                  Surface(
                      color = Color(0xFF0F172A),
                      tonalElevation = 8.dp,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(
                                  Brush.verticalGradient(
                                      listOf(Color(0xFF162238), Color(0xFF0B1120))
                                  )
                              )
                              .padding(horizontal = 10.dp, vertical = 8.dp),
                          verticalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.spacedBy(6.dp)
                          ) {
                              IconButton(
                                  onClick = { if (capturedWebView?.canGoBack() == true) capturedWebView?.goBack() },
                                  modifier = Modifier
                                      .size(34.dp)
                                      .clip(RoundedCornerShape(8.dp))
                                      .background(Color(0xFF1E293B))
                              ) {
                                  Icon(
                                      Icons.Default.ArrowForward,
                                      contentDescription = "رجوع",
                                      tint = Color(0xFFF8FAFC),
                                      modifier = Modifier.size(16.dp)
                                  )
                              }

                              IconButton(
                                  onClick = {
                                      currentUrlDisplay = capturedWebView?.url ?: currentUrlDisplay
                                      capturedWebView?.reload()
                                  },
                                  modifier = Modifier
                                      .size(34.dp)
                                      .clip(RoundedCornerShape(8.dp))
                                      .background(Color(0xFF1E293B))
                              ) {
                                  Icon(
                                      Icons.Default.Refresh,
                                      contentDescription = "تحديث",
                                      tint = Color(0xFF00E5FF),
                                      modifier = Modifier.size(16.dp)
                                  )
                              }

                              Row(
                                  modifier = Modifier
                                      .weight(1f)
                                      .clip(RoundedCornerShape(10.dp))
                                      .background(Color(0xFF090D16))
                                      .border(1.dp, Color(0xFF1E293B), RoundedCornerShape(10.dp))
                                      .padding(horizontal = 10.dp, vertical = 7.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Box(
                                      modifier = Modifier
                                          .size(8.dp)
                                          .clip(CircleShape)
                                          .background(Color(0xFF00E676))
                                  )
                                  Spacer(modifier = Modifier.width(6.dp))
                                  Text(
                                      text = capturedWebView?.url ?: currentUrlDisplay,
                                      color = Color(0xFF00E5FF),
                                      fontFamily = FontFamily.Monospace,
                                      fontSize = 11.sp,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis,
                                      modifier = Modifier.weight(1f)
                                  )
                              }

                              IconButton(
                                  onClick = {
                                      isDesktopMode = !isDesktopMode
                                      capturedWebView?.settings?.apply {
                                          userAgentString = if (isDesktopMode) {
                                              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
                                          } else {
                                              null
                                          }
                                          useWideViewPort = true
                                          loadWithOverviewMode = true
                                      }
                                      capturedWebView?.reload()
                                  },
                                  modifier = Modifier
                                      .size(34.dp)
                                      .clip(RoundedCornerShape(8.dp))
                                      .background(if (isDesktopMode) Color(0xFF00E5FF).copy(alpha = 0.25f) else Color(0xFF1E293B))
                              ) {
                                  Icon(
                                      Icons.Default.Computer,
                                      contentDescription = "وضع الكمبيوتر",
                                      tint = if (isDesktopMode) Color(0xFF00E5FF) else Color(0xFF94A3B8),
                                      modifier = Modifier.size(16.dp)
                                  )
                              }
                          }

                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .horizontalScroll(rememberScrollState()),
                              horizontalArrangement = Arrangement.spacedBy(8.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              val extractHost: () -> String = {
                                  val u = capturedWebView?.url ?: "http://10.0.0.1"
                                  try {
                                      val uri = android.net.Uri.parse(u)
                                      if (!uri.host.isNullOrBlank()) "${uri.scheme ?: "http"}://${uri.host}" else "http://10.0.0.1"
                                  } catch (_: Exception) {
                                      "http://10.0.0.1"
                                  }
                              }

                              AssistChip(
                                  onClick = {
                                      val target = "${extractHost()}/status"
                                      currentUrlDisplay = target
                                      capturedWebView?.loadUrl(target)
                                  },
                                  label = {
                                      Text("📊 صفحة الرصيد (/status)", fontSize = 11.sp, maxLines = 1, softWrap = false)
                                  },
                                  colors = AssistChipDefaults.assistChipColors(
                                      containerColor = Color(0xFF1E293B),
                                      labelColor = Color(0xFF00E5FF)
                                  ),
                                  border = BorderStroke(1.dp, Color(0xFF00E5FF).copy(alpha = 0.4f))
                              )

                              AssistChip(
                                  onClick = {
                                      val target = "${extractHost()}/login"
                                      currentUrlDisplay = target
                                      capturedWebView?.loadUrl(target)
                                  },
                                  label = {
                                      Text("🔑 صفحة الدخول (/login)", fontSize = 11.sp, maxLines = 1, softWrap = false)
                                  },
                                  colors = AssistChipDefaults.assistChipColors(
                                      containerColor = Color(0xFF1E293B),
                                      labelColor = Color(0xFF00E676)
                                  ),
                                  border = BorderStroke(1.dp, Color(0xFF00E676).copy(alpha = 0.4f))
                              )

                              AssistChip(
                                  onClick = {
                                      val target = "${extractHost()}/logout"
                                      currentUrlDisplay = target
                                      capturedWebView?.loadUrl(target)
                                  },
                                  label = {
                                      Text("❄️ تجميد الكرت (/logout)", fontSize = 11.sp, maxLines = 1, softWrap = false)
                                  },
                                  colors = AssistChipDefaults.assistChipColors(
                                      containerColor = Color(0xFF1E293B),
                                      labelColor = Color(0xFFFF5252)
                                  ),
                                  border = BorderStroke(1.dp, Color(0xFFFF5252).copy(alpha = 0.4f))
                              )

                              AssistChip(
                                  onClick = {
                                      capturedWebView?.loadUrl("http://neverssl.com")
                                  },
                                  label = {
                                      Text("🌐 كشف بوابة الشبكة", fontSize = 11.sp, maxLines = 1, softWrap = false)
                                  },
                                  colors = AssistChipDefaults.assistChipColors(
                                      containerColor = Color(0xFF1E293B),
                                      labelColor = Color(0xFFFFB300)
                                  ),
                                  border = BorderStroke(1.dp, Color(0xFFFFB300).copy(alpha = 0.4f))
                              )
                          }
                      }
                  }

                  androidx.compose.ui.viewinterop.AndroidView(
                      factory = { ctx ->
                          factory(ctx).also { view ->
                              if (view is android.webkit.WebView) {
                                  capturedWebView = view
                                  currentUrlDisplay = view.url ?: currentUrlDisplay
                              }
                          }
                      },
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f),
                      update = { view ->
                          if (view is android.webkit.WebView) {
                              capturedWebView = view
                              if (!view.url.isNullOrBlank()) {
                                  currentUrlDisplay = view.url ?: currentUrlDisplay
                              }
                          }
                          update(view)
                      }
                  )
              }
          }
          '''
              r_code = r_code.rstrip() + "\n\n" + cockpit_appendix.strip() + "\n"
              with open(radar_path, "w", encoding="utf-8") as f:
                  f.write(r_code)

          for p in ['setup_part1.py', 'setup_part2.py', 'setup_part3.py']:
              if os.path.exists(p):
                  os.remove(p)
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade to Kroty Pro v3.2: Tab-scoped camera release & Pro Portal Cockpit"
            git push || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK with Smart Error Summary
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          EXIT_CODE=$?
          cat build.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "### ❌ ملخص أخطاء البناء (انسخ هذا النص فقط وأرسله لي):" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |FAILURE:|What went wrong:|^\* What went wrong:" -A 4 build.log | head -n 35 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          else
            echo "### ✅ تم بناء تطبيق كروتي نت Kroty Pro v3.2 بنجاح!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Real APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KrotyNet-Real-APK
          path: app/build/outputs/apk/debug/app-debug.apk
