              with open(main_act_path, "w", encoding="utf-8") as f:
                  f.write(m_text)
              print("Updated MainActivity.kt to v3.2!")

          # 5. Update WalletScreen.kt so buttons never wrap vertically
          wallet_path = "app/src/main/java/com/example/ui/screens/WalletScreen.kt"
          if os.path.exists(wallet_path):
              with open(wallet_path, "r", encoding="utf-8") as f:
                  w_text = f.read()
              w_text = w_text.replace(
                  'Text("اتصال بالبوابة", color = KrotyDarkBg, fontWeight = FontWeight.Bold, fontSize = 12.sp)',
                  'Text("اتصال فوري", color = KrotyDarkBg, fontWeight = FontWeight.Bold, fontSize = 12.sp, maxLines = 1, softWrap = false)'
              )
              with open(wallet_path, "w", encoding="utf-8") as f:
                  f.write(w_text)
              print("Updated WalletScreen.kt!")
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Force update ScannerScreen, RadarScreen, MainActivity, WalletScreen to v3.2 [skip ci]" || true
          git push || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK with Smart Error Summary
        run: |
          set +e
          gradle assembleDebug --no-daemon > build.log 2>&1
          EXIT_CODE=$?
          cat build.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "### ❌ ملخص الخطأ البرمجي (انسخ هذه الأسطر فقط):" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |FAILURE:|What went wrong:" -A 4 build.log | head -n 35 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi
          echo "### ✅ تم بناء تطبيق كروتي نت Pro v3.2 بنجاح!" >> $GITHUB_STEP_SUMMARY

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KrotyNet-Real-APK
          path: app/build/outputs/apk/debug/app-debug.apk
