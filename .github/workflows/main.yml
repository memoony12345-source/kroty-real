name: Build Kroty Net Real APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Kroty Pro v3.2 Zero-Conflict Surgical Upgrades
        run: |
          FIRST_COMMIT=$(git log --reverse --pretty=format:%H -- setup_part3.py | head -n 1)
          if [ -n "$FIRST_COMMIT" ]; then
            git show "$FIRST_COMMIT:setup_part1.py" > /tmp/orig_part1.py 2>/dev/null || true
            git show "$FIRST_COMMIT:setup_part2.py" > /tmp/orig_part2.py 2>/dev/null || true
            git show "$FIRST_COMMIT:setup_part3.py" > /tmp/orig_part3.py 2>/dev/null || true
          fi

          python3 - << 'EOF'
          import re, os

          # 1. Cleanly extract all original working files using rfind('"""')
          for script_name in ['/tmp/orig_part1.py', '/tmp/orig_part2.py', '/tmp/orig_part3.py']:
              if not os.path.exists(script_name):
                  continue
              with open(script_name, 'r', encoding='utf-8') as f:
                  content = f.read()
              chunks = re.split(r'(?m)^(?=write_file\(|print\()', content)
              for chunk in chunks:
                  chunk = chunk.strip()
                  if not chunk.startswith('write_file('):
                      continue
                  m_path = re.search(r'write_file\(\s*"([^"]+)"', chunk)
                  if not m_path:
                      continue
                  file_path = m_path.group(1).strip()
                  first_q = chunk.find('"""')
                  last_q = chunk.rfind('"""')
                  if first_q != -1 and last_q != -1 and last_q > first_q:
                      file_content = chunk[first_q + 3:last_q]
                      dir_name = os.path.dirname(file_path)
                      if dir_name:
                          os.makedirs(dir_name, exist_ok=True)
                      with open(file_path, 'w', encoding='utf-8') as out:
                          out.write(file_content.strip() + '\n')

          def add_missing_imports(code_text, imports_list):
              existing_short_names = set()
              for line in code_text.splitlines():
                  s = line.strip()
                  if s.startswith("import "):
                      existing_short_names.add(s.split(".")[-1].strip())
              to_insert = []
              for imp in imports_list:
                  short_name = imp.split(".")[-1].strip()
                  if short_name not in existing_short_names:
                      to_insert.append(imp)
                      existing_short_names.add(short_name)
              if not to_insert:
                  return code_text
              lines = code_text.splitlines()
              pkg_idx = 0
              for i, line in enumerate(lines):
                  if line.strip().startswith("package "):
                      pkg_idx = i + 1
                      break
              lines[pkg_idx:pkg_idx] = [""] + to_insert
              return "\n".join(lines) + "\n"

          # 2. Update MainActivity.kt title to confirm v3.2 installation
          main_act_path = "app/src/main/java/com/example/MainActivity.kt"
          if os.path.exists(main_act_path):
              with open(main_act_path, "r", encoding="utf-8") as f:
                  m_code = f.read()
              m_code = m_code.replace('"كروتي نت (Kroty Net)"', '"كروتي نت • Kroty Pro v3.2"')
              with open(main_act_path, "w", encoding="utf-8") as f:
                  f.write(m_code)

          # 3. Surgical Upgrade on original working ScannerScreen.kt (0 changed ViewModel/Analyzer calls)
          scanner_path = "app/src/main/java/com/example/ui/screens/ScannerScreen.kt"
          if os.path.exists(scanner_path):
              with open(scanner_path, "r", encoding="utf-8") as f:
                  s_code = f.read()

              # Shorten top header title so Flash & Gallery buttons sit inside the card in full view
              s_code = s_code.replace(
                  '"الماسح الحقيقي للكروت (CameraX + ML Kit)"',
                  '"الماسح الذكي (فلاش + معرض)"'
              )
              # Shorten "تلقائي" to "الكل" so all 5 length chips fit comfortably without squeezing "12 رقم"
              s_code = s_code.replace('"تلقائي"', '"الكل"')

              # Prevent single-string Text labels from wrapping vertically letter-by-letter
              s_code = re.sub(
                  r'Text\(\s*("[^"\n]{1,22}")\s*\)',
                  r'Text(\1, maxLines = 1, softWrap = false)',
                  s_code
              )

              # Bind CameraX to our tab-scoped LifecycleOwner so leaving the Scanner tab immediately unbinds hardware
              s_code = s_code.replace(
                  "= LocalLifecycleOwner.current",
                  "= rememberScannerTabLifecycleOwner()"
              )

              scanner_lifecycle_helper = r'''
          private class ScannerTabLifecycle : androidx.lifecycle.LifecycleOwner {
              val registry = androidx.lifecycle.LifecycleRegistry(this)
              override val lifecycle: androidx.lifecycle.Lifecycle get() = registry
          }

          @Composable
          private fun rememberScannerTabLifecycleOwner(): androidx.lifecycle.LifecycleOwner {
              val context = androidx.compose.ui.platform.LocalContext.current
              val parentOwner = LocalLifecycleOwner.current
              val tabOwner = remember { ScannerTabLifecycle() }

              DisposableEffect(parentOwner) {
                  try {
                      tabOwner.registry.handleLifecycleEvent(androidx.lifecycle.Lifecycle.Event.ON_CREATE)
                      tabOwner.registry.handleLifecycleEvent(androidx.lifecycle.Lifecycle.Event.ON_START)
                      tabOwner.registry.handleLifecycleEvent(androidx.lifecycle.Lifecycle.Event.ON_RESUME)
                  } catch (_: Exception) {}

                  val observer = androidx.lifecycle.LifecycleEventObserver { _, event ->
                      try {
                          tabOwner.registry.handleLifecycleEvent(event)
                      } catch (_: Exception) {}
                  }
                  parentOwner.lifecycle.addObserver(observer)

                  onDispose {
                      parentOwner.lifecycle.removeObserver(observer)
                      try {
                          tabOwner.registry.handleLifecycleEvent(androidx.lifecycle.Lifecycle.Event.ON_PAUSE)
                          tabOwner.registry.handleLifecycleEvent(androidx.lifecycle.Lifecycle.Event.ON_STOP)
                          tabOwner.registry.handleLifecycleEvent(androidx.lifecycle.Lifecycle.Event.ON_DESTROY)
                      } catch (_: Exception) {}
                      try {
                          val providerFuture = androidx.camera.lifecycle.ProcessCameraProvider.getInstance(context)
                          providerFuture.addListener({
                              try {
                                  providerFuture.get().unbindAll()
                              } catch (_: Exception) {}
                          }, androidx.core.content.ContextCompat.getMainExecutor(context))
                      } catch (_: Exception) {}
                  }
              }
              return tabOwner
          }
          '''
              s_code = s_code.rstrip() + "\n\n" + scanner_lifecycle_helper.strip() + "\n"
              with open(scanner_path, "w", encoding="utf-8") as f:
                  f.write(s_code)

          # 4. Surgical Upgrade on original working RadarScreen.kt (Deduplicated imports + Pro Portal Cockpit)
          radar_path = "app/src/main/java/com/example/ui/screens/RadarScreen.kt"
          if os.path.exists(radar_path):
              with open(radar_path, "r", encoding="utf-8") as f:
                  r_code = f.read()

              r_code = add_missing_imports(r_code, [
                  "import androidx.compose.foundation.BorderStroke",
                  "import androidx.compose.foundation.background",
                  "import androidx.compose.foundation.border",
                  "import androidx.compose.foundation.horizontalScroll",
                  "import androidx.compose.foundation.rememberScrollState",
                  "import androidx.compose.ui.draw.clip",
              ])

              r_code = r_code.replace('"يتعلم..."', '"🎯 يتعلم"')
              r_code = re.sub(
                  r'Text\(\s*(if\s*\([^)\n]+\)\s*"[^"\n]+"\s*else\s*"[^"\n]+")\s*\)',
                  r'Text(\1, maxLines = 1, softWrap = false)',
                  r_code
              )
              r_code = re.sub(
                  r'Text\(\s*("[^"\n]{1,25}")\s*\)',
                  r'Text(\1, maxLines = 1, softWrap = false)',
                  r_code
              )

              r_code = r_code.replace("AndroidView(", "KrotyCockpitAndroidView(")

              cockpit_appendix = r'''
          @Composable
          fun <T : android.view.View> KrotyCockpitAndroidView(
              factory: (android.content.Context) -> T,
              modifier: Modifier = Modifier,
              update: (T) -> Unit = {}
          ) {
              var capturedWebView by remember { mutableStateOf<android.webkit.WebView?>(null) }
              var currentUrlDisplay by remember { mutableStateOf("http://10.0.0.1/login") }
              var isDesktopMode by remember { mutableStateOf(false) }

              Column(modifier = modifier.fillMaxSize().background(Color(0xFF0A0E17))) {
                  Surface(
                      color = Color(0xFF0F172A),
                      tonalElevation = 8.dp,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(
                                  androidx.compose.ui.graphics.Brush.verticalGradient(
                                      listOf(Color(0xFF162238), Color(0xFF0B1120))
                                  )
                              )
                              .padding(horizontal = 10.dp, vertical = 8.dp),
                          verticalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.spacedBy(6.dp)
                          ) {
                              IconButton(
                                  onClick = { if (capturedWebView?.canGoBack() == true) capturedWebView?.goBack() },
                                  modifier = Modifier
                                      .size(34.dp)
                                      .clip(RoundedCornerShape(8.dp))
                                      .background(Color(0xFF1E293B))
                              ) {
                                  Icon(
                                      Icons.Default.ArrowForward,
                                      contentDescription = "رجوع",
                                      tint = Color(0xFFF8FAFC),
                                      modifier = Modifier.size(16.dp)
                                  )
                              }

                              IconButton(
                                  onClick = {
                                      currentUrlDisplay = capturedWebView?.url ?: currentUrlDisplay
                                      capturedWebView?.reload()
                                  },
                                  modifier = Modifier
                                      .size(34.dp)
                                      .clip(RoundedCornerShape(8.dp))
                                      .background(Color(0xFF1E293B))
                              ) {
                                  Icon(
                                      Icons.Default.Refresh,
                                      contentDescription = "تحديث",
                                      tint = Color(0xFF00E5FF),
                                      modifier = Modifier.size(16.dp)
                                  )
                              }

                              Row(
                                  modifier = Modifier
                                      .weight(1f)
                                      .clip(RoundedCornerShape(10.dp))
                                      .background(Color(0xFF090D16))
                                      .border(1.dp, Color(0xFF1E293B), RoundedCornerShape(10.dp))
                                      .padding(horizontal = 10.dp, vertical = 7.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Box(
                                      modifier = Modifier
                                          .size(8.dp)
                                          .clip(androidx.compose.foundation.shape.CircleShape)
                                          .background(Color(0xFF00E676))
                                  )
                                  Spacer(modifier = Modifier.width(6.dp))
                                  Text(
                                      text = capturedWebView?.url ?: currentUrlDisplay,
                                      color = Color(0xFF00E5FF),
                                      fontFamily = androidx.compose.ui.text.font.FontFamily.Monospace,
                                      fontSize = 11.sp,
                                      maxLines = 1,
                                      overflow = androidx.compose.ui.text.style.TextOverflow.Ellipsis,
                                      modifier = Modifier.weight(1f)
                                  )
                              }

                              IconButton(
                                  onClick = {
                                      isDesktopMode = !isDesktopMode
                                      capturedWebView?.settings?.apply {
                                          userAgentString = if (isDesktopMode) {
                                              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
                                          } else {
                                              null
                                          }
                                          useWideViewPort = true
                                          loadWithOverviewMode = true
                                      }
                                      capturedWebView?.reload()
                                  },
                                  modifier = Modifier
                                      .size(34.dp)
                                      .clip(RoundedCornerShape(8.dp))
                                      .background(if (isDesktopMode) Color(0xFF00E5FF).copy(alpha = 0.25f) else Color(0xFF1E293B))
                              ) {
                                  Icon(
                                      Icons.Default.Computer,
                                      contentDescription = "وضع الكمبيوتر",
                                      tint = if (isDesktopMode) Color(0xFF00E5FF) else Color(0xFF94A3B8),
                                      modifier = Modifier.size(16.dp)
                                  )
                              }
                          }

                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .horizontalScroll(rememberScrollState()),
                              horizontalArrangement = Arrangement.spacedBy(8.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              val extractHost: () -> String = {
                                  val u = capturedWebView?.url ?: "http://10.0.0.1"
                                  try {
                                      val uri = android.net.Uri.parse(u)
                                      if (!uri.host.isNullOrBlank()) "${uri.scheme ?: "http"}://${uri.host}" else "http://10.0.0.1"
                                  } catch (_: Exception) {
                                      "http://10.0.0.1"
                                  }
                              }

                              AssistChip(
                                  onClick = {
                                      val target = "${extractHost()}/status"
                                      currentUrlDisplay = target
                                      capturedWebView?.loadUrl(target)
                                  },
                                  label = {
                                      Text("📊 صفحة الرصيد (/status)", fontSize = 11.sp, maxLines = 1, softWrap = false)
                                  },
                                  colors = AssistChipDefaults.assistChipColors(
                                      containerColor = Color(0xFF1E293B),
                                      labelColor = Color(0xFF00E5FF)
                                  ),
                                  border = BorderStroke(1.dp, Color(0xFF00E5FF).copy(alpha = 0.4f))
                              )

                              AssistChip(
                                  onClick = {
                                      val target = "${extractHost()}/login"
                                      currentUrlDisplay = target
                                      capturedWebView?.loadUrl(target)
                                  },
                                  label = {
                                      Text("🔑 صفحة الدخول (/login)", fontSize = 11.sp, maxLines = 1, softWrap = false)
                                  },
                                  colors = AssistChipDefaults.assistChipColors(
                                      containerColor = Color(0xFF1E293B),
                                      labelColor = Color(0xFF00E676)
                                  ),
                                  border = BorderStroke(1.dp, Color(0xFF00E676).copy(alpha = 0.4f))
                              )

                              AssistChip(
                                  onClick = {
                                      val target = "${extractHost()}/logout"
                                      currentUrlDisplay = target
                                      capturedWebView?.loadUrl(target)
                                  },
                                  label = {
                                      Text("❄️ تجميد الكرت (/logout)", fontSize = 11.sp, maxLines = 1, softWrap = false)
                                  },
                                  colors = AssistChipDefaults.assistChipColors(
                                      containerColor = Color(0xFF1E293B),
                                      labelColor = Color(0xFFFF5252)
                                  ),
                                  border = BorderStroke(1.dp, Color(0xFFFF5252).copy(alpha = 0.4f))
                              )

                              AssistChip(
                                  onClick = {
                                      capturedWebView?.loadUrl("http://neverssl.com")
                                  },
                                  label = {
                                      Text("🌐 كشف بوابة الشبكة", fontSize = 11.sp, maxLines = 1, softWrap = false)
                                  },
                                  colors = AssistChipDefaults.assistChipColors(
                                      containerColor = Color(0xFF1E293B),
                                      labelColor = Color(0xFFFFB300)
                                  ),
                                  border = BorderStroke(1.dp, Color(0xFFFFB300).copy(alpha = 0.4f))
                              )
                          }
                      }
                  }

                  androidx.compose.ui.viewinterop.AndroidView(
                      factory = { ctx ->
                          factory(ctx).also { view ->
                              if (view is android.webkit.WebView) {
                                  capturedWebView = view
                                  currentUrlDisplay = view.url ?: currentUrlDisplay
                              }
                          }
                      },
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f),
                      update = { view ->
                          if (view is android.webkit.WebView) {
                              capturedWebView = view
                              if (!view.url.isNullOrBlank()) {
                                  currentUrlDisplay = view.url ?: currentUrlDisplay
                              }
                          }
                          update(view)
                      }
                  )
              }
          }
          '''
              r_code = r_code.rstrip() + "\n\n" + cockpit_appendix.strip() + "\n"
              with open(radar_path, "w", encoding="utf-8") as f:
                  f.write(r_code)

          for p in ['setup_part1.py', 'setup_part2.py', 'setup_part3.py']:
              if os.path.exists(p):
                  os.remove(p)
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade to Kroty Pro v3.2: Zero-conflict surgical patch"
            git push || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK with Smart Error Summary
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          EXIT_CODE=$?
          cat build.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "### ❌ ملخص أخطاء البناء (انسخ هذا النص فقط وأرسله لي):" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |FAILURE:|What went wrong:|^\* What went wrong:" -A 4 build.log | head -n 35 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          else
            echo "### ✅ تم بناء تطبيق كروتي نت Kroty Pro v3.2 بنجاح!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Real APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KrotyNet-Real-APK
          path: app/build/outputs/apk/debug/app-debug.apk
