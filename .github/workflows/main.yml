name: Build Kroty Net Real APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean, Patch, and Run Python Builders
        run: |
          python3 - << 'EOF'
          import glob

          for fn in sorted(glob.glob("setup_part*.py")):
              with open(fn, "r", encoding="utf-8") as f:
                  text = f.read()

              # 1. Strip any stray lines after the final print statement
              lines = text.splitlines()
              cleaned = []
              for line in lines:
                  cleaned.append(line)
                  if 'generated successfully!")' in line:
                      break

              # 2. Fix root-dir makedirs, enforce raw strings, and escape inner Kotlin """
              fixed_lines = []
              for line in cleaned:
                  stripped = line.strip()
                  if 'os.makedirs(os.path.dirname(path), exist_ok=True)' in line:
                      line = line.replace(
                          'os.makedirs(os.path.dirname(path), exist_ok=True)',
                          'os.makedirs(os.path.dirname(path) or ".", exist_ok=True)'
                      )
                  elif stripped.startswith('write_file(') and stripped.endswith('"""'):
                      if not stripped.endswith('r"""'):
                          idx = line.rfind('"""')
                          line = line[:idx] + 'r"""'
                  elif stripped == '""")':
                      pass
                  else:
                      if '"""' in line:
                          line = line.replace('"""', '""" + \'"""\' + r"""')
                  fixed_lines.append(line)

              final_text = "\n".join(fixed_lines) + "\n"
              with open(fn, "w", encoding="utf-8") as f:
                  f.write(final_text)
              print("Patched and verified:", fn)
          EOF
          python3 setup_part1.py
          python3 setup_part2.py
          python3 setup_part3.py

      - name: Package Full Source Project as ZIP
        run: |
          zip -r KrotyNet-Full-Source-Project.zip settings.gradle.kts gradle.properties build.gradle.kts gradle app

      - name: Upload Full Source Project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KrotyNet-Full-Source-Project-ZIP
          path: KrotyNet-Full-Source-Project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KrotyNet-Real-APK
          path: app/build/outputs/apk/debug/app-debug.apk
