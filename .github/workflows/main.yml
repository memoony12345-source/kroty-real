              with open(main_act_path, "r", encoding="utf-8") as f:
                  m_text = f.read()
              m_text = m_text.replace("كروتي نت • Kroty Net", "كروتي نت • Kroty Pro v3.2")
              m_text = m_text.replace('Text("الرادار والبوابة")', 'Text("الرادار", maxLines = 1, softWrap = false)')
              m_text = m_text.replace('Text("الماسح")', 'Text("الماسح", maxLines = 1, softWrap = false)')
              m_text = m_text.replace('Text("المحفظة")', 'Text("المحفظة", maxLines = 1, softWrap = false)')
