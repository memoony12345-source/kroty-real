        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          EXIT_CODE=$?
          cat build.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "### ❌ ملخص أخطاء البناء (انسخ هذا النص فقط وأرسله لي):" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |FAILURE:|What went wrong:|^\* What went wrong:" -A 4 build.log | head -n 35 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          else
            echo "### ✅ تم بناء تطبيق كروتي نت Kroty Pro v3.3 بنجاح!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Real APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KrotyNet-Real-APK
          path: app/build/outputs/apk/debug/app-debug.apk
