name: Build Kroty Net Real APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Direct Extract All 41 Project Files
        run: |
          python3 - << 'EOF'
          import glob, os, re

          total_files = 0
          for fn in sorted(glob.glob("setup_part*.py")):
              print(f"=== Extracting from {fn} ===")
              with open(fn, "r", encoding="utf-8") as f:
                  lines = f.read().splitlines()

              current_path = None
              content_lines = []

              for line in lines:
                  if current_path is None:
                      m = re.match(r'^\s*write_file\(\s*"([^"]+)"\s*,\s*r?"""(.*)$', line)
                      if m:
                          current_path = m.group(1).strip()
                          first_line = m.group(2)
                          content_lines = [first_line] if first_line else []
                  else:
                      if line.strip() == '""")':
                          os.makedirs(os.path.dirname(current_path) or ".", exist_ok=True)
                          with open(current_path, "w", encoding="utf-8") as out:
                              out.write("\n".join(content_lines).strip() + "\n")
                          total_files += 1
                          print(f"[{total_files}] Extracted: {current_path}")
                          current_path = None
                          content_lines = []
                      else:
                          content_lines.append(line)

          print(f"Successfully extracted {total_files} files!")
          if total_files < 40:
              raise RuntimeError(f"Expected 41 files, but extracted {total_files}")
          EOF

      - name: Package Full Source Project as ZIP
        run: |
          zip -r KrotyNet-Full-Source-Project.zip settings.gradle.kts gradle.properties build.gradle.kts gradle app

      - name: Upload Full Source Project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KrotyNet-Full-Source-Project-ZIP
          path: KrotyNet-Full-Source-Project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KrotyNet-Real-APK
          path: app/build/outputs/apk/debug/app-debug.apk
