name: Build Kroty Net Real APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert Python Bundles to Standalone Project Files (One-Time Auto Migration)
        run: |
          if ls setup_part*.py 1> /dev/null 2>&1; then
            echo "Found setup_part*.py scripts. Extracting standalone files and migrating repository..."
            python3 - << 'EOF'
          import glob, os, re

          total_files = 0
          for fn in sorted(glob.glob("setup_part*.py")):
              with open(fn, "r", encoding="utf-8") as f:
                  lines = f.read().splitlines()

              current_path = None
              content_lines = []

              for line in lines:
                  if current_path is None:
                      m = re.match(r'^\s*write_file\(\s*"([^"]+)"\s*,\s*r?"""(.*)$', line)
                      if m:
                          current_path = m.group(1).strip()
                          first_line = m.group(2)
                          content_lines = [first_line] if first_line else []
                  else:
                      if line.strip() == '""")':
                          os.makedirs(os.path.dirname(current_path) or ".", exist_ok=True)
                          file_text = "\n".join(content_lines).strip() + "\n"
                          file_text = file_text.replace(
                              "settings.LoadWithOverviewMode = true",
                              "settings.loadWithOverviewMode = true"
                          )
                          file_text = file_text.replace(
                              "import androidx.lifecycle.compose.LocalLifecycleOwner",
                              "import androidx.compose.ui.platform.LocalLifecycleOwner"
                          )
                          file_text = file_text.replace(
                              "appContainer.ocrParser.normalizeOpticalMistakes(visionText.text)",
                              "visionText.text.replace('O', '0').replace('o', '0').replace('I', '1').replace('l', '1').replace('S', '5').replace('B', '8')"
                          )
                          with open(current_path, "w", encoding="utf-8") as out:
                              out.write(file_text)
                          total_files += 1
                          print(f"[{total_files}] Created standalone file: {current_path}")
                          current_path = None
                          content_lines = []
                      else:
                          content_lines.append(line)

          print(f"Successfully extracted {total_files} standalone files!")
          EOF

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -f setup_part*.py
            git add settings.gradle.kts gradle.properties build.gradle.kts gradle app
            git commit -m "Auto-migrate to standalone Android project structure [skip ci]" || true
            git push || true
          else
            echo "Repository is already using standalone Android files! Proceeding directly to build."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK with Smart Error Summary
        run: |
          set +e
          gradle assembleDebug --no-daemon > build.log 2>&1
          EXIT_CODE=$?
          cat build.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "### ❌ ملخص الخطأ البرمجي (انسخ هذه الأسطر فقط):" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |FAILURE:|What went wrong:" -A 4 build.log | head -n 35 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi
          echo "### ✅ تم بناء تطبيق كروتي نت بنجاح!" >> $GITHUB_STEP_SUMMARY

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KrotyNet-Real-APK
          path: app/build/outputs/apk/debug/app-debug.apk
