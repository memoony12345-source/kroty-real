              f.write("\n".join(line[10:] if line.startswith("          ") else line for line in radar_code.splitlines()).strip() + "\n")
          print("Force-updated RadarScreen.kt!")

          # 4. Update MainActivity.kt Title & Bottom Navigation Labels so they never wrap
          main_act_path = "app/src/main/java/com/example/MainActivity.kt"
